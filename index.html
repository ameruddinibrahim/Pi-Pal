<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyword Cluster Organizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Keyword Cluster Organizer</h1>
        <p>Group, assign, and track your keywords by topic</p>
      </div>
      <div class="header-actions">
        <button id="export-btn" class="btn-secondary">Export CSV</button>
        <button id="add-cluster-btn" class="btn-primary">+ New Cluster</button>
      </div>
    </div>
  </header>

  <main>
    <div id="clusters-grid"></div>
    <div id="empty-state">
      <div class="empty-inner">
        <p>No clusters yet. Create one to get started.</p>
        <button id="empty-add-btn" class="btn-primary">+ New Cluster</button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
